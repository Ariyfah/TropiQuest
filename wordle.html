<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset=""UTF-8>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Wordle Game</title>
        <link rel="stylesheet" href="css/style.css">

    </head>
    <body>
        <main class="turtle-wordle-screen">
            <header class="main-island-header">
                <button onclick="window.location.href='island.html'">
                    Back 
                </button>

                <h1>TropiQuest - Wordle</h1>

                <div class="coin-display">
                    🪙 <span id="coinCount" class="coin-amount">500</span>
                </div>
            </header>

            <div id="gameBoard"></div>
            <input type="text" id="guessInput" maxlength="5">
            <div class="wordle-buttons">
                <button id="guessBtn">Guess</button>  
                <button id="restartBtn">Restart</button> 
            </div>
             
        </main>
        <script src="js/main.js"></script>
        <script src="js/wordle.js"></script>
    </body>
</html>
